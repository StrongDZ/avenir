version: "3.8"

services:
    postgres:
        image: postgres:15-alpine
        container_name: avenir-postgres
        environment:
            POSTGRES_DB: ${PG_DATABASE}
            POSTGRES_USER: ${PG_USER}
            POSTGRES_PASSWORD: ${PG_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${PG_USER}"]
            interval: 5s
            timeout: 3s
            retries: 10

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: production-stage
        image: avenir-backend
        container_name: avenir-backend
        environment:
            PG_HOST: ${PG_HOST}
            PG_PORT: ${PG_PORT}
            PG_USER: ${PG_USER}
            PG_PASSWORD: ${PG_PASSWORD}
            PG_DATABASE: ${PG_DATABASE}
            PG_SSL: ${PG_SSL}
        env_file:
            - ./backend/.env
        ports:
            - "${PORT:-4000}:${PORT:-4000}"
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: avenir-frontend
        env_file:
            - ./frontend/.env
        ports:
            - "5173:80"
        depends_on:
            - backend
        restart: unless-stopped

volumes:
    pgdata:
