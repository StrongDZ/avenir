version: "3.8"

services:
    postgres:
        image: postgres:15-alpine
        container_name: avenir-postgres
        environment:
            POSTGRES_DB: ${PG_DATABASE}
            POSTGRES_USER: ${PG_USER}
            POSTGRES_PASSWORD: ${PG_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${PG_USER}"]
            interval: 5s
            timeout: 3s
            retries: 10

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: production-stage
        image: avenir-backend
        container_name: avenir-backend
        env_file:
            - ./backend/.env
        ports:
            - "${PORT:-4000}:${PORT:-4000}"
        depends_on:
            postgres:
                condition: service_healthy
            init-db:
                condition: service_completed_successfully
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: avenir-frontend
        env_file:
            - ./frontend/.env
        ports:
            - "5173:80"
        depends_on:
            - backend
        restart: unless-stopped

    init-db:
        image: avenir-backend
        container_name: avenir-init-db
        env_file:
            - ./backend/.env
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./data:/home/node/app/data:ro
        entrypoint: ["/bin/sh", "-lc"]
        command: |
            "node build/src/scripts/seed.js && node build/src/scripts/demoReset.js"
        restart: "no"

volumes:
    pgdata:
